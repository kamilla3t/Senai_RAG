<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0d0d14"/>
  <!-- grid base -->
  <g stroke="#00e5ff" stroke-width="1" opacity="0.18">
    <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M0 300 H400 M0 350 H400"/>
    <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400"/>
  </g>
  <!-- circuit traces -->
  <g fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.55">
    <path d="M20 20 H120 V80 H200"/>
    <path d="M260 60 V140 H340 V220"/>
    <path d="M40 300 H120 V240 H220 V320"/>
    <path d="M280 380 H200 V300 H360"/>
  </g>
  <!-- circuit nodes -->
  <g fill="#00ff99" opacity="0.9">
    <circle cx="120" cy="20" r="4"/>
    <circle cx="200" cy="80" r="4"/>
    <circle cx="260" cy="60" r="4"/>
    <circle cx="340" cy="140" r="4"/>
    <circle cx="120" cy="240" r="4"/>
    <circle cx="220" cy="320" r="4"/>
    <circle cx="200" cy="300" r="4"/>
    <circle cx="360" cy="300" r="4"/>
  </g>
  <!-- hexagons -->
  <g fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.45">
    <polygon points="60,160 80,148 100,160 100,184 80,196 60,184"/>
    <polygon points="300,20 320,8 340,20 340,44 320,56 300,44"/>
    <polygon points="150,340 170,328 190,340 190,364 170,376 150,364"/>
  </g>
  <!-- dots -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="25" cy="25" r="1.5"/>
    <circle cx="375" cy="25" r="1.5"/>
    <circle cx="25" cy="375" r="1.5"/>
    <circle cx="375" cy="375" r="1.5"/>
    <circle cx="200" cy="200" r="2"/>
  </g>
  <!-- binary text -->
  <g font-family="monospace" font-size="10" fill="#00e5ff" opacity="0.25">
    <text x="210" y="120">1010</text>
    <text x="30" y="260">0101</text>
    <text x="260" y="360">1100</text>
  </g>
</svg>